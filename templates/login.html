{% extends "base.html" %}

{% block title %}Login{% endblock %}

{% block content %}

<div class="container d-flex justify-content-center align-items-center" style="min-height: 80vh;">

    <div class="card p-4 shadow" style="width: 400px;">

        <h3 class="text-center mb-3">Inicio de Sesión</h3>

        <!-- DESCRIPCIÓN -->
        <p class="text-center">
            Ingresa tus credenciales para acceder al sistema de cifrado seguro.
        </p>

        <!-- FORMULARIO -->
        <form method="POST">
            <input type="text" name="username" placeholder="Usuario" class="form-control mb-3" required>

            <input type="password" name="password" placeholder="Contraseña" class="form-control mb-3" required>

            <button class="btn btn-primary w-100">Ingresar</button>
        </form>

        <!-- REGISTRO -->
        <div class="text-center mt-3">
            <a href="/register">¿No tienes cuenta? Crear una</a>
        </div>

        <!-- INFO -->
        <div class="mt-3 text-muted text-center" style="font-size: 14px;">
            Sistema de cifrado con tokens de un solo uso.
        </div>

    </div>

</div>

{% endblock %}
